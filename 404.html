<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page introuvable — Chronicles MG</title>
    <meta name="description" content="Cette page n'existe pas encore. Reviens à l'accueil ou explore les histoires Chronicles." />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components/header.css" />
    <link rel="stylesheet" href="css/components/mobile-nav.css" />
    <link rel="stylesheet" href="css/components/buttons.css" />
    <link rel="stylesheet" href="css/components/cta-band.css" />
    <link rel="stylesheet" href="css/components/footer.css" />
    <link rel="stylesheet" href="css/components/feedback.css" />
    <style>
        /* ============================================================
       ERROR 404 SECTION
       ============================================================ */
        .error {
            position: relative;
            padding-top: calc(var(--header-height) + 4rem);
            padding-bottom: 5rem;
            text-align: center;
            overflow: hidden;
        }

        /* Sparkles — same visual vocabulary as the homepage hero */
        .error__sparkle {
            position: absolute;
            color: var(--blue-600);
            pointer-events: none;
            z-index: 0;
            animation: hero-sparkle 3.2s ease-in-out infinite;
        }

        .error__sparkle svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        .error__sparkle--1 {
            top: calc(var(--header-height) + 3rem);
            left: 9%;
            width: 30px;
            height: 30px;
            animation-delay: 0s;
        }

        .error__sparkle--2 {
            top: calc(var(--header-height) + 10rem);
            right: 10%;
            width: 22px;
            height: 22px;
            animation-delay: 1.3s;
        }

        @keyframes hero-sparkle {

            0%,
            100% {
                opacity: 0.35;
                transform: scale(0.85) rotate(-12deg);
            }

            50% {
                opacity: 1;
                transform: scale(1.1) rotate(12deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .error__sparkle {
                animation: none;
                opacity: 0.6;
            }
        }

        @media (max-width: 700px) {
            .error__sparkle--1 {
                width: 20px;
                height: 20px;
                left: 5%;
            }

            .error__sparkle--2 {
                width: 16px;
                height: 16px;
                right: 6%;
                top: calc(var(--header-height) + 6rem);
            }
        }

        /* --- Eyebrow pill --- */
        .error__eyebrow {
            display: inline-block;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--blue-700);
            padding: 0.35rem 0.85rem;
            border-radius: 999px;
            margin-bottom: 2rem;
            position: relative;
            z-index: 1;
        }

        /* --- Three BD-style digit panels: 4 0 4 --- */
        .error__digits {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.25rem;
            margin-bottom: 3rem;
            position: relative;
            z-index: 1;
        }

        .error__digit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 130px;
            height: 130px;
            background: var(--panel);
            border: 4px solid var(--ink);
            box-shadow: 9px 9px 0 var(--ink);
            font-size: 4.25rem;
            font-weight: 900;
            color: var(--ink);
            line-height: 1;
            letter-spacing: -0.05em;
            transform: rotate(var(--tilt, 0deg));
            transition:
                transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.28s ease;
        }

        .error__digit:hover {
            transform: rotate(0deg) scale(1.08);
            box-shadow: 13px 13px 0 var(--ink);
        }

        .error__digit--1 {
            --tilt: -6deg;
        }

        .error__digit--2 {
            --tilt: 4deg;
            background: var(--blue-600);
            color: var(--white);
        }

        .error__digit--3 {
            --tilt: -4deg;
        }

        @media (max-width: 600px) {
            .error__digits {
                gap: 0.75rem;
                margin-bottom: 2rem;
            }

            .error__digit {
                width: 82px;
                height: 82px;
                font-size: 2.6rem;
                box-shadow: 6px 6px 0 var(--ink);
                border-width: 3px;
            }

            .error__digit:hover {
                transform: rotate(0deg) scale(1.05);
                box-shadow: 8px 8px 0 var(--ink);
            }
        }

        /* --- Message --- */
        .error__title {
            font-weight: 900;
            font-size: clamp(1.9rem, 5vw, 2.75rem);
            line-height: 1.1;
            letter-spacing: -0.03em;
            color: var(--ink);
            margin: 0 auto 1.25rem;
            max-width: 22ch;
        }

        .error__title .highlight {
            color: var(--blue-600);
            background-image: linear-gradient(var(--gray-100), var(--gray-100));
            background-repeat: no-repeat;
            background-position: 0 82%;
            background-size: 100% 0.3em;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
            padding: 0 2px;
        }

        .error__subtitle {
            color: var(--gray-600);
            font-size: 1.05rem;
            max-width: 560px;
            margin: 0 auto 2.5rem;
            line-height: 1.7;
        }

        /* --- Actions --- */
        .error__actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.9rem;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .error__actions .btn {
            width: min(100%, 320px);
            justify-content: center;
            padding: 0.9rem 1.4rem;
            font-size: 0.95rem;
        }

        @media (min-width: 700px) {
            .error__actions {
                flex-direction: row;
                justify-content: center;
            }

            .error__actions .btn {
                width: auto;
            }
        }

        /* --- Footer note --- */
        .error__note {
            margin-top: 3rem;
            font-size: 0.85rem;
            font-style: italic;
            color: var(--gray-600);
        }

        .error__note a {
            color: var(--blue-600);
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .error__note a:hover {
            color: var(--blue-700);
        }

    </style>
</head>

<body>

    <main>

        <!-- ===== 404 ===== -->
        <section class="error" aria-labelledby="error-title">

            <!-- Sparkles -->
            <span class="error__sparkle error__sparkle--1" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M12 1.5l2.1 7.3L21.5 12l-7.4 3.2L12 22.5 9.9 15.2 2.5 12l7.4-3.2z" />
                </svg>
            </span>
            <span class="error__sparkle error__sparkle--2" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M12 1.5l2.1 7.3L21.5 12l-7.4 3.2L12 22.5 9.9 15.2 2.5 12l7.4-3.2z" />
                </svg>
            </span>

            <div class="container">

                <span class="error__eyebrow">Erreur</span>

                <!-- Three tilted BD panels: 4 0 4 -->
                <div class="error__digits" aria-hidden="true">
                    <span class="error__digit error__digit--1">4</span>
                    <span class="error__digit error__digit--2">0</span>
                    <span class="error__digit error__digit--3">4</span>
                </div>

                <h1 class="error__title" id="error-title">
                    Cette <span class="highlight">Page n'existe pas</span>.
                </h1>

                <p class="error__subtitle">
                    Le contenu que tu cherches a peut-être été arrachée ou déplacée.
                </p>

                <div class="error__actions">
                    <a href="index.html" class="btn btn--primary">Retour à l'accueil</a>
                    <a href="login.html" data-route="login" class="btn btn--outline">Explorer les histoires</a>
                </div>

            </div>
        </section>

    </main>

    <a href="#" data-link="feedback" class="feedback" aria-label="Donner un retour">Feedback</a>


    <script src="js/config.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
